[package]
edition      = "2024"
name         = "mqtt_led"
rust-version = "1.95"
version      = "0.1.0"
publish      = false
license      = "MIT OR Apache-2.0"

[[bin]]
name = "mqtt_led"
path = "./src/bin/main.rs"

# Generated with esp-generate from the workshop template, then extended in
# Assignment 2. The chip features are moved to the board features below, so
# one crate builds for every workshop board (`cargo run-<board>`, see
# .cargo/config.toml).

[dependencies]
embassy-executor  = { version = "0.10.0", features = ["log"] }
embassy-futures   = "0.1"
embassy-net       = { version = "0.9.1", features = ["dhcpv4", "dns", "log", "medium-ethernet", "tcp", "udp"] }
embassy-sync      = "0.8"
embassy-time      = { version = "0.5.0", features = ["log"] }
esp-hal-smartled  = "0.18"
heapless          = "0.9"
log               = "0.4.27"
rust-mqtt         = "0.6"
smart-leds        = "0.4"
static_cell       = "2.1.1"

[dependencies.esp-hal]
features = ["log-04", "unstable"]
git      = "https://github.com/Hahihula/esp-hal"
rev      = "7306e1fbc8e6629b9437bc91289a2232f27e6c93"

[dependencies.esp-bootloader-esp-idf]
features = ["log-04"]
git      = "https://github.com/Hahihula/esp-hal"
rev      = "7306e1fbc8e6629b9437bc91289a2232f27e6c93"

[dependencies.esp-println]
features = ["log-04"]
git      = "https://github.com/Hahihula/esp-hal"
rev      = "7306e1fbc8e6629b9437bc91289a2232f27e6c93"

[dependencies.esp-backtrace]
features = ["panic-handler", "println"]
git      = "https://github.com/Hahihula/esp-hal"
rev      = "7306e1fbc8e6629b9437bc91289a2232f27e6c93"

[dependencies.esp-alloc]
git = "https://github.com/Hahihula/esp-hal"
rev = "7306e1fbc8e6629b9437bc91289a2232f27e6c93"

[dependencies.esp-rtos]
features = ["embassy", "esp-alloc", "esp-radio", "log-04"]
git      = "https://github.com/Hahihula/esp-hal"
rev      = "7306e1fbc8e6629b9437bc91289a2232f27e6c93"

[dependencies.esp-radio]
features = ["esp-alloc", "log-04", "unstable", "wifi"]
git      = "https://github.com/Hahihula/esp-hal"
rev      = "7306e1fbc8e6629b9437bc91289a2232f27e6c93"

# esp-hal-smartled comes from crates.io and asks for esp-hal from crates.io.
# Use the same esp-hal commit as above instead, so the firmware has one esp-hal.
[patch.crates-io]
esp-hal = { git = "https://github.com/Hahihula/esp-hal", rev = "7306e1fbc8e6629b9437bc91289a2232f27e6c93" }

[features]
# ---- Boards: select exactly one (the cargo aliases in .cargo/config.toml do it for you) ----
s31-function-coreboard = ["esp32s31"]
s31-korvo              = ["esp32s31"]
c6-devkitc             = ["esp32c6"]
c5-devkitc             = ["esp32c5"]
c3-rust-board          = ["esp32c3"]
c3-lcdkit              = ["esp32c3"]

# ---- Chips: selected by the board features above ----
esp32c3 = [
    "esp-alloc/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-hal/esp32c3",
    "esp-println/esp32c3",
    "esp-radio/esp32c3",
    "esp-rtos/esp32c3",
]
esp32c5 = [
    "esp-alloc/esp32c5",
    "esp-backtrace/esp32c5",
    "esp-bootloader-esp-idf/esp32c5",
    "esp-hal/esp32c5",
    "esp-println/esp32c5",
    "esp-radio/esp32c5",
    "esp-rtos/esp32c5",
]
esp32c6 = [
    "esp-alloc/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-hal/esp32c6",
    "esp-println/esp32c6",
    "esp-radio/esp32c6",
    "esp-rtos/esp32c6",
]
esp32s31 = [
    "esp-alloc/esp32s31",
    "esp-backtrace/esp32s31",
    "esp-bootloader-esp-idf/esp32s31",
    "esp-hal/esp32s31",
    "esp-println/esp32s31",
    "esp-radio/esp32s31",
    "esp-rtos/esp32s31",
]

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
